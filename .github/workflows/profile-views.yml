name: Update Profile Views
on:
  schedule: [{cron: "0 * * * *"}]
  workflow_dispatch:
  push: {branches: ["main", "master"]}

jobs:
  update-views:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Update Count and Generate Badge
        run: |
          # 如果不存在则创建计数文件
          [ -f views.txt ] || echo 0 > views.txt
          COUNT=$(($(cat views.txt) + 1))
          echo $COUNT > views.txt
          
          # 生成一个漂亮的渐变背景徽章 (自定义颜色在这里改)
          # color=00d2ff 是亮蓝色，你可以换成 hotpink 或 橙色(ff9100)
          curl -s "https://img.shields.io/badge/VISITS-${COUNT}-00d2ff?style=for-the-badge&logo=github" > profile_views_badge.svg

      - name: Commit and Push
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Action"
          git add views.txt profile_views_badge.svg
          git commit -m "Update profile views" || exit 0
          git push
