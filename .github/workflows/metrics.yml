name: Metrics
on:
  # 每天午夜自动更新
  schedule: [{cron: "0 0 * * *"}]
  # 支持手动触发更新
  workflow_dispatch:
  # 每次 push 到 main 分支时更新
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: bvzrays
          template: classic
          base: header, community, repositories, metadata
          config_timezone: Asia/Shanghai
